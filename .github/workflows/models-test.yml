name: Test GitHub Models
on: workflow_dispatch
permissions:
  models: read
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Call GitHub Models
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for m in openai/gpt-4.1-mini openai/gpt-4o-mini meta/llama-3.3-70b-instruct openai/gpt-4.1; do
            echo "== $m"
            curl -sS -m 60 https://models.github.ai/inference/chat/completions \
              -H "Authorization: Bearer $GH_TOKEN" -H "Content-Type: application/json" \
              -d "{\"model\":\"$m\",\"messages\":[{\"role\":\"user\",\"content\":\"Say hi in 3 words\"}],\"max_tokens\":20}" -w "\nHTTP %{http_code}\n" | tail -c 400
          done
          echo "== catalog"; curl -sS -m 30 https://models.github.ai/catalog/models -H "Authorization: Bearer $GH_TOKEN" | head -c 1500
