name: Test GitHub Models
on: workflow_dispatch
permissions:
  models: read
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "== real"; curl -sS -m 60 https://models.github.ai/inference/chat/completions -H "Authorization: Bearer $GH_TOKEN" -H "Content-Type: application/json" -d '{"model":"openai/gpt-4.1-mini","messages":[{"role":"user","content":"What is 17 times 3? Answer with a sentence."}]}' | head -c 500; echo
          echo "== bogus model, no auth"; curl -sS -m 60 https://models.github.ai/inference/chat/completions -H "Content-Type: application/json" -d '{"model":"zzz/notreal","messages":[]}' | head -c 300; echo
          echo "== azure endpoint"; curl -sS -m 60 https://models.inference.ai.azure.com/chat/completions -H "Authorization: Bearer $GH_TOKEN" -H "Content-Type: application/json" -d '{"model":"gpt-4o-mini","messages":[{"role":"user","content":"What is 17 times 3?"}]}' -w "\nHTTP %{http_code}" | head -c 500; echo
