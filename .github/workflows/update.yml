name: Update league + sims

on:
  schedule:
    - cron: "*/30 * * * *"   # checks ESPN every 30 min; sims only rerun when something changed
    - cron: "5-55/10 16-23 * * 0"   # game day: every 10 min Sunday 8am-4pm PT
    - cron: "5-55/10 0-5 * * 1,2,5" # every 10 min Sun/Mon/Thu night games (Pacific evening = UTC after midnight)
  workflow_dispatch: {}   # lets you hit "Run workflow" on the Actions tab any time

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Time bucket for nflverse cache
        id: tb
        run: echo "b=$(date -u +%Y%m%d)-$(( 10#$(date -u +%H) / 6 ))" >> "$GITHUB_OUTPUT"
      - name: Reuse nflverse stats pulled in the last 6 hours
        id: nfl
        uses: actions/cache@v4
        with:
          path: data/usage.json
          key: nflverse-v3-${{ steps.tb.outputs.b }}
      - name: Pull ESPN + nflverse, run sims for every league
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          SWID: ${{ secrets.SWID }}
          NFL_CACHED: ${{ steps.nfl.outputs.cache-hit }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          PUSH_SUB: ${{ secrets.PUSH_SUB }}
        run: |
          python scripts/run_all.py
          python scripts/notify.py publish
          python scripts/alerts.py || echo "alerts failed"
      - name: Save results
        run: |
          git config user.name "oxtail-bot"
          git config user.email "oxtail-bot@users.noreply.github.com"
          git add docs/data data docs/push_key.txt 2>/dev/null || git add docs/data data
          git diff --cached --quiet || git commit -m "Update odds $(date -u +'%Y-%m-%d %H:%M') UTC"
          git push
