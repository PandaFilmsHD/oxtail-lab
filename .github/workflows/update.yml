name: Update league + sims

on:
  schedule:
    - cron: "*/30 * * * *"   # checks ESPN every 30 min; sims only rerun when something changed
    - cron: "5-55/10 16-23 * * 0"   # game day: every 10 min Sunday 8am-4pm PT
    - cron: "5-55/10 0-5 * * 1,2,5" # every 10 min Sun/Mon/Thu night games (Pacific evening = UTC after midnight)
  workflow_dispatch: {}   # lets you hit "Run workflow" on the Actions tab any time

permissions:
  contents: write
  actions: write   # lets each run start the next one


jobs:
  update:
    concurrency:
      group: update
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Time bucket for nflverse cache
        id: tb
        run: echo "b=$(date -u +%Y%m%d-%H)" >> "$GITHUB_OUTPUT"
      - name: Reuse nflverse stats pulled this hour
        id: nfl
        uses: actions/cache@v4
        with:
          path: data/usage.json
          key: nflverse-v3-${{ steps.tb.outputs.b }}
      - name: Pull ESPN + nflverse, run sims for every league
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          SWID: ${{ secrets.SWID }}
          NFL_CACHED: ${{ steps.nfl.outputs.cache-hit }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          PUSH_SUB: ${{ secrets.PUSH_SUB }}
        run: |
          python scripts/run_all.py
          python scripts/notify.py publish
          python scripts/alerts.py || echo "alerts failed"
      - name: Post picks, receipts and results to Discord
        env:
          DISCORD_BEST: ${{ secrets.DISCORD_BEST }}
          DISCORD_PARLAYS: ${{ secrets.DISCORD_PARLAYS }}
          DISCORD_KALSHI: ${{ secrets.DISCORD_KALSHI }}
          DISCORD_RESULTS: ${{ secrets.DISCORD_RESULTS }}
          DISCORD_RECEIPTS: ${{ secrets.DISCORD_RECEIPTS }}
          DISCORD_TDS: ${{ secrets.DISCORD_TDS }}
        run: python -u scripts/post_discord.py || echo "discord failed"
      - name: Save results
        run: |
          git config user.name "oxtail-bot"
          git config user.email "oxtail-bot@users.noreply.github.com"
          git add docs/data data docs/push_key.txt 2>/dev/null || git add docs/data data
          git diff --cached --quiet || git commit -m "Update odds $(date -u +'%Y-%m-%d %H:%M') UTC"
          # if someone pushed code meanwhile, replay our results on top (keep our data files) so alert memory is never lost
          for i in 1 2 3 4 5; do
            git push && break
            git fetch origin main && git rebase -X theirs origin/main || { git rebase --abort; git pull --no-rebase -X ours origin main --no-edit; }
            sleep $((i * 3))
          done
      - name: Start the live play watcher when a game with your starters is on
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(python scripts/live_plays.py --should-run 2>/dev/null)" = "yes" ]; then
            a=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/live.yml/runs?status=in_progress" --jq '.total_count')
            b=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/live.yml/runs?status=queued" --jq '.total_count')
            if [ "$a" = 0 ] && [ "$b" = 0 ]; then gh workflow run live.yml --ref main -R "$GITHUB_REPOSITORY" && echo "live watcher started"; else echo "live watcher already running"; fi
          fi

      - name: Start the live Kalshi watcher when any game is on
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(python scripts/live_kalshi.py --should-run 2>/dev/null)" = "yes" ]; then
            a=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/live_kalshi.yml/runs?status=in_progress" --jq '.total_count')
            b=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/live_kalshi.yml/runs?status=queued" --jq '.total_count')
            if [ "$a" = 0 ] && [ "$b" = 0 ]; then gh workflow run live_kalshi.yml --ref main -R "$GITHUB_REPOSITORY" && echo "live kalshi started"; else echo "live kalshi already running"; fi
          fi

  next:
    needs: update
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Start the next run (GitHub's schedule can lag by hours, so each run queues the next one itself)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          D=$(date -u +%u); H=$((10#$(date -u +%H)))
          # game windows (UTC): Sun 16-23, Mon/Tue/Fri 0-5 (Sun/Mon/Thu night games) -> every 10 min, else every 30
          if { [ "$D" = 7 ] && [ $H -ge 16 ]; } || { [[ "$D" =~ ^(1|2|5)$ ]] && [ $H -le 5 ]; }; then WAIT=7; else WAIT=25; fi
          echo "next run in about $WAIT min"
          sleep $((WAIT * 60))
          newest=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/update.yml/runs?per_page=1" --jq '.workflow_runs[0].id')
          if [ "$newest" != "${{ github.run_id }}" ]; then echo "a newer run already exists, not starting another"; exit 0; fi
          for i in 1 2 3 4 5; do gh workflow run update.yml --ref main -R "$GITHUB_REPOSITORY" && break; echo "queue failed, retry $i"; sleep $((i * 20)); done
