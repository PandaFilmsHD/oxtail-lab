name: Test push

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Send a test push (prints only where it went and the push service's answer)
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          PUSH_SUB: ${{ secrets.PUSH_SUB }}
        run: |
          python -u - <<'PY'
          import json, os, sys
          sys.path.insert(0, "scripts")
          raw = os.environ.get("PUSH_SUB", "").strip()
          subs = json.loads(raw) if raw else []
          subs = subs if isinstance(subs, list) else [subs]
          print("subscriptions saved:", len(subs))
          for s in subs:
              ep = s.get("endpoint", "")
              print(" endpoint host:", ep.split("/")[2] if "//" in ep else "?", "| keys present:", sorted((s.get("keys") or {}).keys()))
          import notify
          print("result:", notify.send("🧪 Oxtail test push", "If you see this, pushes reach your phone.", tag="test-now"))
          PY
