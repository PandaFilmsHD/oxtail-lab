name: Fit live in-game model

on:
  workflow_dispatch:
  schedule:
    - cron: "7 14 * * 2"   # Tuesday morning, after Monday night

permissions:
  contents: write

concurrency:
  group: fit-live
  cancel-in-progress: false

jobs:
  fit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas numpy scikit-learn
      - name: Train and backtest
        run: python -u scripts/fit_live.py
      - name: Save
        run: |
          git config user.name "oxtail-bot"; git config user.email "bot@users.noreply.github.com"
          git add data/live_model.json data/live_report.json
          git commit -m "Live model refit" || exit 0
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q && break; sleep 5; done
