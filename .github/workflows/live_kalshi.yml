name: Live Kalshi watcher

on:
  workflow_dispatch:
    inputs:
      dry:
        description: "one pass, print what it would flag, no posting"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: live-kalshi-${{ inputs.dry }}
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Watch
        env:
          DISCORD_LIVE: ${{ secrets.DISCORD_LIVE }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          git config user.name "oxtail-bot"; git config user.email "oxtail-bot@users.noreply.github.com"
          if [ "${{ inputs.dry }}" = "true" ]; then python -u scripts/live_kalshi.py --dry; else python -u scripts/live_kalshi.py; fi
