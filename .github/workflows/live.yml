name: Live plays (Od from Oxtail)

on:
  workflow_dispatch:
    inputs:
      probe:
        description: "Just print the ESPN feed format"
        required: false
        default: "false"

permissions:
  contents: read

concurrency:
  group: live
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Watch games
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          PUSH_SUB: ${{ secrets.PUSH_SUB }}
        run: |
          if [ "${{ github.event.inputs.probe }}" = "true" ]; then python scripts/live_plays.py --probe; else python scripts/live_plays.py; fi
